version: '3.9'

services:
  backend:
    build: ./backend
    container_name: ballxpit-backend
    ports:
      - '3000:3000'
    env_file:
      - ./backend/.env
    volumes:
      - sqlite_data:/app/prisma/data

  frontend:
    build: ./frontend
    container_name: ballxpit-frontend
    environment:
      - API_URL=http://localhost:3000
      - VITE_API_URL=http://localhost:3000
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  sqlite_data:
